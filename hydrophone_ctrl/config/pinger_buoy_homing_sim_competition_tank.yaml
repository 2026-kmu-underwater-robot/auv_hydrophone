# Pinger Buoy Homing Simulation - 실제 대회장 수조 파라미터
#
# Region 실행:
#   ros2 launch hydrophone_ctrl pinger_buoy_region_local_homing_sim.launch.py \
#     config_file:=/absolute/path/pinger_buoy_homing_sim_competition_tank.yaml
#
# Near-zone 실행:
#   ros2 launch hydrophone_ctrl pinger_buoy_near_zone_line_search_sim.launch.py \
#     config_file:=/absolute/path/pinger_buoy_homing_sim_competition_tank.yaml
#
# 실제 대회장 수조 프로파일과 제어 파라미터는 같고, 시뮬레이션 시간과
# MuJoCo odometry 입력만 시뮬레이션용으로 설정한다.

pinger_buoy_audio_sim:
  ros__parameters:
    use_sim_time: false
    odometry_topic: /sim/odom

sim_odometry_rebaser:
  ros__parameters:
    use_sim_time: false
    input_topic: /sim/odom
    output_topic: /odometry/filtered

audio_frequency_detector:
  ros__parameters:
    use_sim_time: false

region_local_gradient_estimator:
  ros__parameters:
    use_sim_time: false

    # 토픽과 좌표계
    odometry_topic: /odometry/filtered
    start_frame_topic: /start_frame
    snr_topic: /audio_frequency_detector/snr_db_stamped
    state_topic: /homing/control_state
    region_gradient_topic: /homing/region_gradient
    rolling_gradient_topic: /homing/rolling_gradient
    arena_frame_id: arena

    # 그래디언트 추정
    region_sample_spacing_m: 0.15
    homing_gradient_window_size: 12
    min_homing_gradient_samples: 8
    min_region_gradient_magnitude: 0.05
    min_region_lateral_spread_m: 0.10
    odometry_timeout_s: 0.5
    max_snr_odom_skew_s: 0.15

waypoint_homing_controller:
  ros__parameters:
    use_sim_time: false

    # 토픽과 좌표계
    odometry_topic: /odometry/filtered
    start_frame_topic: /start_frame
    state_topic: /homing/control_state
    waypoint_topic: /homing/current_waypoint
    scan_center_topic: /homing/scan_center
    region_gradient_topic: /homing/region_gradient
    rolling_gradient_topic: /homing/rolling_gradient
    homing_direction_topic: /homing/homing_direction
    vision_search_request_topic: /homing/vision_search_active
    target_confirmed_topic: /vision/target_confirmed
    vision_control_granted_topic: /homing/vision_control_granted
    rc_override_topic: /mavros/rc/override
    emergency_stop_topic: /mission/emergency_stop
    arena_frame_id: arena

    # 미션과 안전
    enable_keyboard_emergency_stop: true
    emergency_stop_key: s
    arena_start_corner: bottom_left
    invert_rc_yaw: true
    vision_handoff_enabled: true
    acoustic_timeout_s: 600.0
    odometry_timeout_s: 0.5
    rate_hz: 30.0

    # 수조 경계
    arena_length_m: 16.0
    arena_width_m: 15.0
    arena_offset_x_m: -0.55
    arena_offset_y_m: 0.55
    arena_safety_margin_m: 0.5

    # 원형 스캔과 호밍
    initial_scan_radius_m: 1.5
    rescan_radius_m: 0.7
    homing_waypoint_step_m: 1.0
    homing_zigzag_offset_m: 0.2
    rolling_gradient_alpha: 0.15
    rolling_gradient_conflict_angle_rad: 1.0472
    rolling_gradient_conflict_limit: 3
    waypoint_reach_tolerance_m: 0.15
    scan_forward_command: 0.65
    scan_yaw_feedforward: 0.20
    scan_radial_kp: 0.8
    scan_radial_ki: 0.0
    scan_radial_kd: 0.10
    scan_radial_integral_limit: 1.0
    vision_near_zone_width_m: 1.0

    # 수심 PID
    target_depth_z_m: -8.65
    depth_tolerance_m: 0.15
    depth_kp: 0.8
    depth_ki: 0.15
    depth_kd: 0.02
    depth_bias: 0.1
    heave_limit: 0.4

    # 수평 RC 제어
    forward_cruise: 0.8
    forward_slow: 0.08
    waypoint_slowdown_distance_m: 0.25
    waypoint_settle_speed_mps: 0.15
    waypoint_settle_hold_sec: 0.3
    yaw_kp: 0.5
    yaw_ki: 0.1
    yaw_kd: 0.2
    yaw_integral_limit: 0.5
    yaw_limit: 0.50
    move_heading_tolerance_rad: 0.1745
    move_heading_release_rad: 0.3491
    vision_heading_tolerance_rad: 0.12
    rc_pwm_span: 400.0

near_zone_line_search_controller:
  ros__parameters:
    use_sim_time: false

    # 토픽과 좌표계
    odometry_topic: /odometry/filtered
    start_frame_topic: /start_frame
    snr_topic: /audio_frequency_detector/snr_db_stamped
    state_topic: /homing/control_state
    waypoint_topic: /homing/current_waypoint
    peak_topic: /homing/snr_peak_position
    vision_search_request_topic: /homing/vision_search_active
    target_confirmed_topic: /vision/target_confirmed
    vision_control_granted_topic: /homing/vision_control_granted
    rc_override_topic: /mavros/rc/override
    emergency_stop_topic: /mission/emergency_stop
    arena_frame_id: arena

    # 미션과 안전
    enable_keyboard_emergency_stop: true
    emergency_stop_key: s
    arena_start_corner: bottom_left
    invert_rc_yaw: true
    acoustic_timeout_s: 300.0
    shallow_start_clearance_m: 1.5
    odometry_timeout_s: 0.5
    rate_hz: 30.0

    # 수조 경계
    arena_length_m: 16.0
    arena_width_m: 15.0
    arena_offset_x_m: -0.55
    arena_offset_y_m: 0.55
    arena_safety_margin_m: 0.5
    vision_near_zone_width_m: 0.5
    near_zone_entry_wall_clearance_m: 1.5

    # Line search와 SNR peak 판정
    line_search_direction: 1
    line_search_end_wall_clearance_m: 1.5
    line_search_start_depth_tolerance_m: 0.20
    waypoint_reach_tolerance_m: 0.15
    vision_confirmation_distance_m: 1.0
    snr_sample_spacing_m: 0.15
    global_max_region_window_size: 5
    snr_median_window_size: 3
    snr_timeout_s: 1.0
    max_snr_odom_skew_s: 0.15

    # 수심 PID
    target_depth_z_m: -8.65
    depth_kp: 0.8
    depth_ki: 0.15
    depth_kd: 0.02
    depth_bias: 0.1
    depth_integral_limit: 2.0
    heave_limit: 0.4

    # 수평 RC 제어
    forward_cruise: 0.8
    forward_slow: 0.08
    waypoint_slowdown_distance_m: 0.25
    waypoint_settle_speed_mps: 0.15
    waypoint_settle_hold_sec: 0.3
    yaw_kp: 0.5
    yaw_ki: 0.1
    yaw_kd: 0.2
    yaw_integral_limit: 0.5
    yaw_limit: 0.50
    move_heading_tolerance_rad: 0.1745
    move_heading_release_rad: 0.3491
    vision_heading_tolerance_rad: 0.12
    rc_pwm_span: 400.0

region_local_gradient_rviz_visualizer:
  ros__parameters:
    use_sim_time: false
    odometry_topic: /odometry/filtered
    start_frame_topic: /start_frame
    arena_frame_id: arena
    snr_topic: /audio_frequency_detector/snr_db_stamped
    region_gradient_topic: /homing/region_gradient
    rolling_gradient_topic: /homing/rolling_gradient
    homing_direction_topic: /homing/homing_direction
    waypoint_topic: /homing/current_waypoint
    scan_center_topic: /homing/scan_center
    marker_topic: /homing/rviz/markers
    arena_length_m: 16.0
    arena_width_m: 15.0
    arena_offset_x_m: -0.55
    arena_offset_y_m: 0.55
    arena_safety_margin_m: 0.5
    vision_near_zone_width_m: 0.5
    arena_start_corner: bottom_left
    map_cell_size_m: 0.15
